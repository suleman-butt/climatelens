[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "climatelens"
dynamic = ["version"]
description = "Cloud-native weather forecasts for German cities"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "google-cloud-storage==2.19.0",
    "jinja2==3.1.6",
    "lightgbm==4.5.0",
    "pandas==2.2.3",
    "pyarrow==25.0.1",
    "pydantic-settings==2.7.1",
    "scikit-learn==1.6.1",
    "uvicorn[standard]==0.34.0",
    "wetterdienst==0.136.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.9.2",
]

[project.scripts]
climatelens = "climatelens.jobs:main"

[tool.setuptools.dynamic]
# Single source of truth: climatelens.__version__ (also the image tag, vX.Y.Z).
version = {attr = "climatelens.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
climatelens = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
